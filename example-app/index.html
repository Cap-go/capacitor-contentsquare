<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@capgo/capacitor-contentsquare Example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Capgo plugin example</p>
        <h1>Contentsquare test console</h1>
        <p class="lead">
          Use this sample shell to trigger the core Contentsquare APIs from a Capacitor 8 app: consent, screenviews,
          transactions, and dynamic variables.
        </p>
      </section>

      <section class="panel">
        <div class="status-row">
          <div>
            <p class="label">Tracking state</p>
            <strong id="status-badge" class="badge">Loading</strong>
          </div>
        </div>

        <div class="actions">
          <button id="opt-in">Opt in</button>
          <button id="opt-out" class="danger">Opt out</button>
          <button id="send-screen" class="ghost">Send screenview</button>
          <button id="send-transaction" class="ghost">Send transaction</button>
          <button id="send-dynamic-var" class="ghost">Send dynamic var</button>
        </div>

        <pre id="plugin-output">Waiting for interaction...</pre>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
